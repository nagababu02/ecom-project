apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecom-product-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nagababu02/ecom-project.git
    targetRevision: main
    path: kubernetes/base
  destination:
    server: https://kubernetes.default.svc
    namespace: ecom
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
